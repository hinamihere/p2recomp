# Checks pull requests that add or change hand-written replacements for recompiled functions (the decomp work).
# Runs on GitHub's machines without any game data:
#  - the PR may only touch game/src/native_funcs.cpp, game/overrides.txt and docs/decomp/ (the maintainer can add the
#    `allow-infra` label for other changes)
#  - the PR description must contain the `p2-check: PASS ...` line that tools/ci_check.sh printed for the PR's head
#    commit (AGENTS.md). The real check (build, differential fuzz, savestate replays) needs the game data, so the author
#    runs it locally. This job only makes sure it was run on exactly this code. The maintainer reruns it before merging.
name: decomp-check

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited, labeled]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Only replacement files changed
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'allow-infra') }}
        run: |
          bad=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...HEAD | grep -vE '^(game/src/native_funcs\.cpp|game/overrides\.txt|docs/decomp/.*)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::This PR touches files outside the replacement files:"; echo "$bad"
            echo "Ask the maintainer for the allow-infra label if that is intended."
            exit 1
          fi
      - name: Local check result matches this PR
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'allow-infra') }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/ci_stamp.py ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
